[project]
name = "forge"
version = "0.1.0"
description = "A Software Factory"
readme = "README.md"
authors = [
    { name = "Rameez Khan", email = "rameez@rameezkhan.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.149",
]

[project.scripts]
forge = "forge:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
python_functions = ["test_*", "*_then_*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]
