name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      markdown-only: ${{ steps.decide.outputs.markdown-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        run: |
          markdown_only="$(scripts/markdown-only.sh "$BASE" "$HEAD")"
          echo "markdown-only=$markdown_only" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}

  check-no-vm:
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.markdown-only != 'true'
    runs-on: ubuntu-latest
    environment: &cachix-environment
      name: ${{ github.event_name == 'push' && 'cachix' || '' }}
      deployment: false
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - &install-nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - &use-cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: rameezk-forge
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: |
          nix_path="$(command -v nix)"
          nix develop --command bash -c 'PATH="$1:$PATH" exec make check-no-vm' _ "${nix_path%/*}"

  vm-tests:
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.markdown-only != 'true'
    runs-on: ubuntu-latest
    environment: *cachix-environment
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - *checkout
      - *install-nix
      - *use-cachix
      - id: list
        run: |
          nix_path="$(command -v nix)"
          tests="$(nix develop --command bash -c 'PATH="$1:$PATH" exec scripts/checks.sh list vm x86_64-linux' _ "${nix_path%/*}" | jq --raw-input --null-input --compact-output '[inputs]')"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  vm-test:
    timeout-minutes: 15
    needs: vm-tests
    runs-on: ubuntu-latest
    environment: *cachix-environment
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.vm-tests.outputs.tests) }}
    steps:
      - *checkout
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - *install-nix
      - *use-cachix
      - run: nix build --print-build-logs --no-link ".#checks.x86_64-linux.$TEST"
        env:
          TEST: ${{ matrix.test }}

  ci:
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - check-no-vm
      - vm-tests
      - vm-test
    runs-on: ubuntu-latest
    steps:
      - run: |
          jq --exit-status --arg markdown_only "$MARKDOWN_ONLY" '
            .changes.result == "success"
            and all(.[]; .result == "success" or ($markdown_only == "true" and .result == "skipped"))
          ' <<<"$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
          MARKDOWN_ONLY: ${{ needs.changes.outputs.markdown-only }}
