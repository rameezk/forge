name: probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  without-deployment:
    runs-on: ubuntu-latest
    environment:
      name: cachix
      deployment: false
    steps:
      - run: echo "token length ${#T}"
        env:
          T: ${{ secrets.CACHIX_AUTH_TOKEN }}
  with-deployment:
    runs-on: ubuntu-latest
    environment: cachix
    steps:
      - run: echo "token length ${#T}"
        env:
          T: ${{ secrets.CACHIX_AUTH_TOKEN }}
